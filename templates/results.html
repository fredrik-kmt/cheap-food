{% for offer in offers %}
<div class="bg-white rounded-lg shadow hover:shadow-md transition-shadow duration-200 overflow-hidden flex flex-col">
    <div class="h-48 overflow-hidden bg-gray-100 flex items-center justify-center relative">
        {% if offer.image %}
        <img src="{{ offer.image }}" alt="{{ offer.heading }}" class="object-cover w-full h-full">
        {% else %}
        <span class="text-gray-400">No image</span>
        {% endif %}
        <div class="absolute top-2 right-2 bg-white px-2 py-1 rounded shadow text-xs font-bold text-gray-700">
            {{ offer.store_name }}
        </div>
    </div>

    <div class="p-4 flex-grow flex flex-col justify-between">
        <div>
            <h3 class="font-bold text-lg mb-1 truncate" title="{{ offer.heading }}">{{ offer.heading }}</h3>
            {% if offer.description %}
            <p class="text-sm text-gray-600 mb-2 line-clamp-2" title="{{ offer.description }}">{{ offer.description }}</p>
            {% endif %}
        </div>

        <div class="mt-4 flex items-center justify-between">
            <span class="text-xl font-bold text-green-600">
                {{ offer.price }} {{ offer.currency }}
            </span>
            <form hx-post="/add_to_list" hx-target="#shopping-list">
                <input type="hidden" name="id" value="{{ offer.id }}">
                <input type="hidden" name="heading" value="{{ offer.heading }}">
                <input type="hidden" name="price" value="{{ offer.price }}">
                <input type="hidden" name="currency" value="{{ offer.currency }}">
                <input type="hidden" name="store_name" value="{{ offer.store_name }}">
                <input type="hidden" name="image" value="{{ offer.image }}">
                <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 transition-colors text-sm">
                    Add +
                </button>
            </form>
        </div>
    </div>
</div>
{% else %}
<div class="col-span-full text-center text-gray-500 py-8">
    No offers found. Try a different search term.
</div>
{% endfor %}
