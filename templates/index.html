<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Deals Denmark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4 flex flex-col md:flex-row gap-4">
        <!-- Main Content -->
        <div class="w-full md:w-2/3">
            <h1 class="text-3xl font-bold mb-6 text-blue-800">🇩🇰 Supermarket Deals</h1>

            <div class="mb-6">
                <input type="text"
                       name="q"
                       class="w-full p-4 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                       placeholder="Search for offers (e.g. kød, is, mælk)..."
                       hx-get="/search"
                       hx-trigger="keyup changed delay:500ms"
                       hx-target="#results"
                       hx-indicator="#loading">
            </div>

            <div id="loading" class="htmx-indicator text-center text-gray-500 my-4">
                Loading offers...
            </div>

            <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Results will be loaded here -->
            </div>
        </div>

        <!-- Shopping List Sidebar -->
        <div class="w-full md:w-1/3">
            <div class="bg-white p-4 rounded-lg shadow sticky top-4">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">🛒 Shopping List</h2>
                <div id="shopping-list">
                    {% include 'shopping_list.html' %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
