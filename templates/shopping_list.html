{% if items %}
<ul class="space-y-3">
    {% for item in items %}
    <li class="flex items-center justify-between bg-gray-50 p-2 rounded border">
        <div class="flex items-center gap-2 overflow-hidden">
            {% if item.image %}
            <img src="{{ item.image }}" alt="" class="w-10 h-10 object-cover rounded">
            {% endif %}
            <div class="min-w-0">
                <p class="text-sm font-medium truncate">{{ item.heading }}</p>
                <p class="text-xs text-gray-500">{{ item.store_name }} - {{ item.price }} {{ item.currency }}</p>
            </div>
        </div>
        <form hx-post="/remove_from_list" hx-target="#shopping-list">
            <input type="hidden" name="id" value="{{ item.id }}">
            <button type="submit" class="text-red-500 hover:text-red-700 p-1">
                ✕
            </button>
        </form>
    </li>
    {% endfor %}
</ul>
<div class="mt-4 pt-4 border-t flex justify-between items-center font-bold">
    <span>Total Items:</span>
    <span>{{ items|length }}</span>
</div>
{% else %}
<div class="text-center text-gray-500 py-4">
    Your list is empty.
</div>
{% endif %}
