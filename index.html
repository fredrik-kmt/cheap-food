<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danish Food Deals</title>
    <!-- Shopping Cart Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.scrollTo(0,0)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-emerald-600">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                </svg>
                <h1 class="text-xl font-bold tracking-tight text-slate-800">Scraper<span class="text-emerald-600">Deals</span></h1>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleSettings()" class="p-2 rounded-full hover:bg-slate-100 transition-colors focus:outline-none" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-slate-600">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.581-.495.644-.869l.214-1.281z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
                <button onclick="toggleCart()" class="relative p-2 rounded-full hover:bg-slate-100 transition-colors focus:outline-none" title="Open Shopping List">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-slate-700">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                    </svg>
                    <span id="cart-count" class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-emerald-600 rounded-full opacity-0 transition-opacity">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="toggleSettings()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white rounded-2xl shadow-2xl p-6">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Settings</h2>
            <p class="text-sm text-slate-500 mb-4">Enter your EmailJS API keys to enable email functionality.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Service ID</label>
                    <input type="text" id="setting-service-id" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Template ID</label>
                    <input type="text" id="setting-template-id" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Public Key</label>
                    <input type="text" id="setting-public-key" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="toggleSettings()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors shadow-md">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <!-- Search Section -->
        <div class="max-w-2xl mx-auto mb-12 text-center space-y-4">
            <h2 class="text-3xl font-bold text-slate-800">Find the best food offers</h2>
            <p class="text-slate-500">Searching Netto, Rema 1000, Coop 365 & Spar</p>
            <div class="relative group">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search for 'ice cream', 'chicken', 'milk'..."
                    class="w-full px-6 py-4 text-lg bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all placeholder:text-slate-400"
                    onkeydown="if(event.key === 'Enter') performSearch()"
                >
                <div class="absolute inset-y-0 right-0 flex items-center pr-4">
                    <button onclick="performSearch()" class="p-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 transition-colors shadow-md hover:shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Grid -->
        <div id="results-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Results will be injected here -->
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-emerald-600"></div>
            <p class="mt-2 text-slate-500 text-sm font-medium">Searching best deals...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <p class="text-slate-500 text-lg">No offers found. Try a different search term.</p>
        </div>

    </main>

    <!-- Shopping List Sidebar (Drawer) -->
    <div id="cart-drawer" class="fixed inset-0 z-50 transform translate-x-full transition-transform duration-300 ease-in-out">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" onclick="toggleCart()"></div>

        <!-- Drawer Content -->
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col h-full">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h2 class="text-xl font-bold text-slate-800">Shopping List</h2>
                <button onclick="toggleCart()" class="p-2 text-slate-400 hover:text-slate-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Cart items injected here -->
                <div class="text-center text-slate-400 py-12">
                    Your list is empty.
                </div>
            </div>

            <div class="p-6 border-t border-slate-100 bg-slate-50 space-y-3">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-500">Total Items</span>
                    <span id="cart-total-count" class="font-bold text-slate-800">0</span>
                </div>

                <div class="space-y-2">
                    <input type="email" id="recipient-email" placeholder="Enter recipient email..." class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
                    <button onclick="sendEmail()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold hover:bg-emerald-700 transition-colors shadow-lg shadow-emerald-200 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                        Send to Email
                    </button>
                </div>

                <button onclick="window.print()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-semibold hover:bg-slate-700 transition-colors shadow-lg shadow-slate-200 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                         <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0110.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0l.229 2.523a1.125 1.125 0 01-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0021 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 00-1.913-.247M6.34 18H5.25A2.25 2.25 0 013 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 001.913-.247m10.5 0a48.536 48.536 0 00-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5zm-3 0h.008v.008H15V10.5z" />
                    </svg>
                    Print List
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const API_URL = "https://api.etilbudsavis.dk/v2/offers";
        // Dealer IDs: Netto, Rema 1000, Spar, Coop 365
        const DEALER_IDS = ["9ba51", "11deC", "88ddE", "DWZE1w"];
        const DEFAULT_LAT = 55.676098;
        const DEFAULT_LNG = 12.568337;
        const DEFAULT_RADIUS = 10000;

        // --- State ---
        let cart = JSON.parse(localStorage.getItem('shoppingList')) || [];

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            updateCartUI();
            loadSettings();
        });

        // --- Functions ---

        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results-container').innerHTML = '';
            document.getElementById('empty-state').classList.add('hidden');

            try {
                const offers = await fetchOffers(query);
                renderOffers(offers);
            } catch (error) {
                console.error("Search failed:", error);
                document.getElementById('results-container').innerHTML = `<p class="text-red-500 text-center col-span-full">Something went wrong. Please try again.</p>`;
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function fetchOffers(query) {
            const params = new URLSearchParams({
                r_lat: DEFAULT_LAT,
                r_lng: DEFAULT_LNG,
                r_radius: DEFAULT_RADIUS,
                limit: 24,
                dealer_ids: DEALER_IDS.join(',')
            });

            if (query) {
                params.append('query', query);
                const url = `${API_URL}/search?${params.toString()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('API Error');
                return await response.json();
            } else {
                const url = `${API_URL}?${params.toString()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('API Error');
                return await response.json();
            }
        }

        function renderOffers(offers) {
            const container = document.getElementById('results-container');
            if (!offers || offers.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            container.innerHTML = offers.map(offer => {
                const price = offer.pricing.price;
                const currency = offer.pricing.currency;
                const title = offer.heading;
                const store = offer.branding.name;
                const image = offer.images.view || offer.images.thumb;
                const id = offer.id;
                // Parse date
                const validUntil = offer.run_till ? new Date(offer.run_till).toLocaleDateString() : 'Unknown';

                return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition-shadow flex flex-col h-full fade-in group">
                        <div class="relative aspect-square mb-4 overflow-hidden rounded-xl bg-slate-50">
                            <img src="${image}" alt="${title}" class="object-contain w-full h-full mix-blend-multiply group-hover:scale-105 transition-transform duration-300">
                            <div class="absolute top-2 right-2 bg-white/90 backdrop-blur text-xs font-bold px-2 py-1 rounded-md shadow-sm border border-slate-100">
                                ${store}
                            </div>
                        </div>
                        <div class="flex-grow">
                            <h3 class="font-medium text-slate-800 line-clamp-2 mb-1" title="${title}">${title}</h3>
                            <div class="flex flex-col gap-1">
                                <p class="text-sm text-slate-500">${offer.quantity?.size?.from || ''} ${offer.quantity?.unit?.symbol || ''}</p>
                                <p class="text-xs text-slate-400">Valid until: ${validUntil}</p>
                            </div>
                        </div>
                        <div class="flex items-end justify-between mt-4 pt-4 border-t border-slate-50">
                            <div class="text-emerald-700 font-bold text-lg">
                                ${price} <span class="text-sm font-normal text-emerald-600">${currency}</span>
                            </div>
                            <button onclick='addToCart(${JSON.stringify({id, title, price, currency, store, image, validUntil}).replace(/'/g, "&#39;")})'
                                class="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-emerald-600 hover:text-white transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- Cart Functions ---

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            if (drawer.classList.contains('translate-x-full')) {
                drawer.classList.remove('translate-x-full');
            } else {
                drawer.classList.add('translate-x-full');
            }
        }

        function addToCart(item) {
            // Check if exists
            if (!cart.some(i => i.id === item.id)) {
                cart.push(item);
                saveCart();
                updateCartUI();

                // Visual feedback (optional)
                const btn = event.currentTarget;
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>`;
                btn.classList.add('bg-emerald-600', 'text-white');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('bg-emerald-600', 'text-white');
                }, 1000);
            } else {
                // Shake or notify already added
                alert("Already in list!");
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem('shoppingList', JSON.stringify(cart));
        }

        function sendEmail() {
            if (cart.length === 0) {
                alert("Your list is empty!");
                return;
            }

            const email = document.getElementById('recipient-email').value;
            if (!email) {
                alert("Please enter an email address.");
                return;
            }

            // Get keys from localStorage
            const SERVICE_ID = localStorage.getItem('emailjs_service_id');
            const TEMPLATE_ID = localStorage.getItem('emailjs_template_id');
            const PUBLIC_KEY = localStorage.getItem('emailjs_public_key');

            if (!SERVICE_ID || !TEMPLATE_ID || !PUBLIC_KEY) {
                if(confirm("EmailJS is not configured. Would you like to open Settings to enter your API keys?")) {
                    toggleSettings();
                }
                return;
            }

            // Initialize EmailJS
            emailjs.init(PUBLIC_KEY);

            let message = "Here is my shopping list:\n\n";
            cart.forEach(item => {
                message += `- ${item.title}\n`;
                message += `  Price: ${item.price} ${item.currency}\n`;
                message += `  Store: ${item.store}\n`;
                message += `  Valid until: ${item.validUntil}\n\n`;
            });

            const templateParams = {
                to_email: email,
                message: message
            };

            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = "Sending...";
            btn.disabled = true;

            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then(function() {
                    alert('Email sent successfully!');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, function(error) {
                    alert('Failed to send email. Check console for details.');
                    console.error('EmailJS Error:', error);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        }

        // --- Settings Functions ---

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
        }

        function saveSettings() {
            const serviceId = document.getElementById('setting-service-id').value.trim();
            const templateId = document.getElementById('setting-template-id').value.trim();
            const publicKey = document.getElementById('setting-public-key').value.trim();

            if (serviceId && templateId && publicKey) {
                localStorage.setItem('emailjs_service_id', serviceId);
                localStorage.setItem('emailjs_template_id', templateId);
                localStorage.setItem('emailjs_public_key', publicKey);
                alert("Settings saved!");
                toggleSettings();
            } else {
                alert("Please fill in all fields.");
            }
        }

        function loadSettings() {
            document.getElementById('setting-service-id').value = localStorage.getItem('emailjs_service_id') || '';
            document.getElementById('setting-template-id').value = localStorage.getItem('emailjs_template_id') || '';
            document.getElementById('setting-public-key').value = localStorage.getItem('emailjs_public_key') || '';
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const countBadge = document.getElementById('cart-count');
            const totalCount = document.getElementById('cart-total-count');

            // Update Badge
            if (cart.length > 0) {
                countBadge.textContent = cart.length;
                countBadge.classList.remove('opacity-0');
            } else {
                countBadge.classList.add('opacity-0');
            }
            totalCount.textContent = cart.length;

            // Render List
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-12 flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mb-4 opacity-50">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                    </svg>
                    <p>Your list is empty.</p>
                </div>`;
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="flex items-center gap-4 bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                    <img src="${item.image}" alt="" class="w-12 h-12 object-contain bg-slate-50 rounded-lg">
                    <div class="flex-grow min-w-0">
                        <h4 class="text-sm font-medium text-slate-800 truncate" title="${item.title}">${item.title}</h4>
                        <div class="flex flex-col text-xs text-slate-500 gap-1">
                            <div class="flex gap-2">
                                <span class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">${item.store}</span>
                                <span class="font-bold text-emerald-700">${item.price} ${item.currency}</span>
                            </div>
                            <span class="text-slate-400">Until: ${item.validUntil || 'Unknown'}</span>
                        </div>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="text-slate-400 hover:text-red-500 transition-colors p-1">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15" />
                        </svg>
                    </button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
